# Buck Rogers: Countdown to Doomsday - deutscher Dialogtext, ECL-Modul 3
# de = deutscher Text (leer = englisches Original bleibt). en = nur Referenz, nicht aendern.
# Zeichen: normale Gross-/Kleinschreibung, ä ö ü Ä Ö Ü, ß; \n = Zeilenumbruch (nur wo das Original einen hat).

[[text]]
id = "M003_000"
befehl = ["PRINTCLEAR"]
en = "THE ONCE-PROUD EARTH HAS BEEN REDUCED TO DESOLATE RUINS BY THE GREED OF RAM. ONLY NEO PROTECTS THE PLANET FROM FURTHER PLUNDER."
de = ""

[[text]]
id = "M003_001"
befehl = ["PRINTCLEAR"]
en = "BUCK ROGER'S TIRELESS EFFORTS FOR THE NEW EARTH ORGANIZATION HAVE PROVEN AN INSPIRATION FOR ALL IN THIS TIME OF NEED."
de = ""

[[text]]
id = "M003_002"
befehl = ["PRINTCLEAR"]
en = "BASED ON MARS, THE RUSSO-AMERICAN MERCANTILE CARES ONLY FOR PROFIT. TO DOMINATE THE SOLAR SYSTEM, THEY MUST ENSLAVE EARTH."
de = ""

[[text]]
id = "M003_003"
befehl = ["PRINTCLEAR"]
en = "RAM IS NOT ABOVE CREATING GENETICALLY ENGINEERED HORRORS, SUCH AS THE TERRINE, TO FURTHER ITS CAUSE."
de = ""

[[text]]
id = "M003_004"
befehl = ["PRINTCLEAR"]
en = "YOU SEE A SIMULATED COMBAT BETWEEN NEO FORCES AND THE TERRINES."
de = ""

[[text]]
id = "M003_005"
befehl = ["PRINTCLEAR"]
en = "THE VENUS LOWLANDS PRODUCE GRAVITOL, A DRUG ESSENTIAL FOR SPACE TRAVEL."
de = ""

[[text]]
id = "M003_006"
befehl = ["PRINTCLEAR"]
en = "ONLY THE LOWLANDERS CAN SURVIVE IN THE ACID SWAMPS OF VENUS."
de = ""

[[text]]
id = "M003_007"
befehl = ["PRINTCLEAR"]
en = "THE PROUD DESERT RUNNERS MUST SHARE MARS WITH RAM. AGAINST RAM'S MIGHT, THEIR RACE FACES CERTAIN EXTINCTION."
de = ""

[[text]]
id = "M003_008"
befehl = ["PRINTCLEAR"]
en = "THE CORRUPT MARIPOSAS, IN ORBIT AROUND MERCURY, HAVE A MONOPOLY ON ENERGY SOURCES FOR THE SOLAR SYSTEM."
de = ""

[[text]]
id = "M003_009"
befehl = ["PRINTCLEAR"]
en = "NEO RELIES ON NEW RECRUITS SUCH AS YOURSELVES TO GIVE IT STRENGTH AND TO PROVIDE HOPE FOR THE FUTURE."
de = ""
