# Buck Rogers: Countdown to Doomsday - deutscher Dialogtext, ECL-Modul 33
# de = deutscher Text (leer = englisches Original bleibt). en = nur Referenz, nicht aendern.
# Zeichen: normale Gross-/Kleinschreibung, ä ö ü Ä Ö Ü, ß; \n = Zeilenumbruch (nur wo das Original einen hat).

[[text]]
id = "M033_000"
befehl = ["PRINTCLEAR"]
en = "THE DOOR IS BARRICADED. THE CREATURES CAN SLIP THROUGH THE WALL CONDUITS."
de = "Die Tür ist verbarrikadiert. Die Wesen können durch die Kanäle in den Wänden schlüpfen."

[[text]]
id = "M033_001"
befehl = ["PRINTCLEAR"]
en = "A GENNIE SPRINGS OUT OF A SOLID WALL."
de = "Ein Gennie springt aus einer massiven Wand."

[[text]]
id = "M033_002"
befehl = ["PRINTCLEAR"]
en = "WITH THE BARRICADE UNGUARDED, YOU RIP IT APART EASILY."
de = "Die Barrikade ist unbewacht, ihr reißt sie mühelos ein."

[[text]]
id = "M033_003"
befehl = ["PRINT"]
en = "A STAGE 3 HAS EMERGED. IT IS WEAK.'"
de = "Ein Stufe-3-ECG ist geschlüpft. Er ist noch schwach.'"

[[text]]
id = "M033_004"
befehl = ["PRINT"]
en = "IT IS MOVING ABOUT, EXAMINING THE CONTROLS.'"
de = "Er bewegt sich umher und untersucht die Steuerung.'"

[[text]]
id = "M033_005"
befehl = ["PRINT"]
en = "IT HAS ACTIVATED A COMPUTER. IT IS LEARNING QUICKLY.'"
de = "Er hat einen Computer eingeschaltet. Er lernt schnell.'"

[[text]]
id = "M033_006"
befehl = ["PRINT"]
en = "ITS MANIPULATING THE CONTROLS, LEARNING TO PILOT.'"
de = "Er bedient die Steuerung und lernt zu fliegen.'"

[[text]]
id = "M033_007"
befehl = ["PRINT"]
en = " AWAKES SCREAMING, EYES UNFOCUSED."
de = " erwacht schreiend, mit leerem Blick."

[[text]]
id = "M033_008"
befehl = ["PRINT"]
en = " ATTACKS."
de = " greift an."

[[text]]
id = "M033_009"
befehl = ["PRINT"]
en = " SUDDENLY KEELS OVER."
de = " kippt plötzlich um."

[[text]]
id = "M033_010"
befehl = ["PRINT"]
en = " GETS A SPLITTING HEADACHE."
de = " bekommt rasende Kopfschmerzen."

[[text]]
id = "M033_011"
befehl = ["PRINT"]
en = " NOTICES A SLOWLY SPREADING RASH."
de = " bemerkt einen Ausschlag, der sich langsam ausbreitet."

[[text]]
id = "M033_012"
befehl = ["PRINT"]
en = "'S LEG ITCHES FOR A MOMENT."
de = " spürt kurz ein Jucken im Bein."

[[text]]
id = "M033_013"
befehl = ["HMENU"]
menue = true
en = "UP"
de = "Hoch"

[[text]]
id = "M033_014"
befehl = ["HMENU"]
menue = true
en = "DOWN"
de = "Runter"

[[text]]
id = "M033_015"
befehl = ["HMENU"]
menue = true
en = "STAY"
de = "Bleiben"

[[text]]
id = "M033_016"
befehl = ["HMENU"]
menue = true
en = "UP"
de = "Hoch"

[[text]]
id = "M033_017"
befehl = ["HMENU"]
menue = true
en = "STAY"
de = "Bleiben"

[[text]]
id = "M033_018"
befehl = ["HMENU"]
menue = true
en = "DOWN"
de = "Runter"

[[text]]
id = "M033_019"
befehl = ["HMENU"]
menue = true
en = "STAY"
de = "Bleiben"

[[text]]
id = "M033_020"
befehl = ["PRINTCLEAR"]
en = "A HORDE OF HIDEOUS GENNIES RUSH YOU. THEY ARE VERY QUICK."
de = "Eine Horde scheußlicher Gennies stürmt auf euch zu. Sie sind sehr schnell."

[[text]]
id = "M033_021"
befehl = ["PRINTCLEAR"]
en = "YOU HEAR SCRABBLING BEHIND THE WALLS. MORE WILL SOON BE HERE."
de = "Hinter den Wänden hört ihr Scharren. Bald kommen mehr."

[[text]]
id = "M033_022"
befehl = ["PRINTCLEAR"]
en = "YOU COULD JUST FIT INTO THE AIRSHAFT. "
de = "Ihr würdet gerade so in den Luftschacht passen. "

[[text]]
id = "M033_023"
befehl = ["PRINT"]
en = "YOU HAVE TO TRAVEL IN SINGLE FILE. SOMEONE MIGHT HAVE TO FIGHT ALONE. "
de = "Ihr müsst hintereinander gehen. Vielleicht muss jemand allein kämpfen. "

[[text]]
id = "M033_024"
befehl = ["PRINT"]
en = "DO YOU ENTER?"
de = "Hineingehen?"

[[text]]
id = "M033_025"
befehl = ["PRINTCLEAR"]
en = "THIS IS THE BIO-MONITORING STATION. "
de = "Das ist die Biomonitor-Station. "

[[text]]
id = "M033_026"
befehl = ["WHMENU"]
menue = true
en = "IGNORE"
de = "Ignorieren"

[[text]]
id = "M033_027"
befehl = ["WHMENU"]
menue = true
en = "OPERATE"
de = "Bedienen"

[[text]]
id = "M033_028"
befehl = ["PRINTCLEAR"]
en = "IT INDICATES THAT YOU ARE THE ONLY HUMANS ON BOARD. MANY LIFE FORMS ARE ON DECK 6."
de = "Laut Anzeige seid ihr die einzigen Menschen an Bord. Auf Deck 6 sind viele Lebensformen."

[[text]]
id = "M033_029"
befehl = ["PRINTCLEAR"]
en = "AS YOU WATCH, A NEW READING APPEARS. "
de = "Während ihr zuseht, erscheint ein neuer Messwert. "

[[text]]
id = "M033_030"
befehl = ["PRINTCLEAR"]
en = "A GENNIE PULLS ITSELF OUT OF THE AIRSHAFT AND FLASHES TOWARD YOU."
de = "Ein Gennie zieht sich aus dem Luftschacht und schnellt auf euch zu."

[[text]]
id = "M033_031"
befehl = ["PRINTCLEAR"]
en = "THE MEDICAL LAB IS PRISTINE. A SMALL DATA COMPUTER IS ATTACHED TO A TABLE."
de = "Das Medizinlabor ist makellos. Ein kleiner Datencomputer ist an einem Tisch befestigt."

[[text]]
id = "M033_032"
befehl = ["HMENU"]
menue = true
en = "USE"
de = "Benutzen"

[[text]]
id = "M033_033"
befehl = ["HMENU"]
menue = true
en = "TAKE"
de = "Nehmen"

[[text]]
id = "M033_034"
befehl = ["HMENU"]
menue = true
en = "IGNORE"
de = "Ignorieren"

[[text]]
id = "M033_035"
befehl = ["PRINTCLEAR"]
en = "THE COMPUTER STATES, 'REQUIRE VALID VOICE PRINT.' "
de = "Der Computer meldet: 'Gültiger Stimmabdruck erforderlich.' "

[[text]]
id = "M033_036"
befehl = ["HMENU"]
menue = true
en = "TAKE"
de = "Nehmen"

[[text]]
id = "M033_037"
befehl = ["HMENU"]
menue = true
en = "IGNORE"
de = "Ignorieren"

[[text]]
id = "M033_038"
befehl = ["PRINTCLEAR"]
en = "YOU SCOOP UP THE COMPUTER AND FIND SOME POISON ANTIDOTES."
de = "Ihr nehmt den Computer und findet einige Gegengifte."

[[text]]
id = "M033_039"
befehl = ["PRINTCLEAR"]
en = "SCOT.DOS APPEARS AND SAYS, 'DATACOMP1, THIS IS SCOT. GIVE ME FULL INFORMATION FEED.'"
de = "Scot.DOS erscheint und sagt: 'Datacomp1, hier ist Scot. Gib mir alle Informationen.'"

[[text]]
id = "M033_040"
befehl = ["PRINTCLEAR"]
en = "AUTOMATED SURGEONS DANGLE ABOVE TABLES. ON ONE AN AUTOPSY WAS PERFORMED. NEXT TO THE CORPSE IS A UNIFORM AND A READOUT."
de = "Über den Tischen hängen OP-Automaten. Auf einem Tisch liegt eine obduzierte Leiche, daneben eine Uniform und ein Ausdruck."

[[text]]
id = "M033_041"
befehl = ["PRINTCLEAR"]
en = "THE UNIFORM HAS THE NAME 'DR. CONCHITEZ' AND A NUMBER. THE READOUT LISTS A PROTECTION AGAINST THE PARASITE."
de = "Auf der Uniform stehen der Name 'Dr. Conchitez' und eine Nummer. Der Ausdruck nennt einen Schutz gegen den Parasiten."

[[text]]
id = "M033_042"
befehl = ["PRINTCLEAR"]
en = "DO YOU USE THE SURGEON TO EXTRACT A PARASITE?"
de = "Lasst ihr den Automaten einen Parasiten entfernen?"

[[text]]
id = "M033_043"
befehl = ["WHO"]
en = "WHO WILL BE OPERATED ON?"
de = "Wer wird operiert?"

[[text]]
id = "M033_044"
befehl = ["PRINTCLEAR"]
en = "THAT ONE IS NOT INFECTED. OPERATE ANYWAY?"
de = "Diese Figur ist nicht befallen. Trotzdem operieren?"

[[text]]
id = "M033_045"
befehl = ["PRINTCLEAR"]
en = "YOU ACTIVATE THE SURGEON. IT INTONES, 'SIGMA NUMBER.' "
de = "Ihr schaltet den Automaten ein. Er verkündet: 'Sigma-Nummer.' "

[[text]]
id = "M033_046"
befehl = ["WHMENU"]
menue = true
en = "SPEAK"
de = "Sprechen"

[[text]]
id = "M033_047"
befehl = ["WHMENU"]
menue = true
en = "TURN IT OFF"
de = "Abschalten"

[[text]]
id = "M033_048"
befehl = ["WHMENU"]
menue = true
en = "REPROGRAM"
de = "Umprogrammieren"

[[text]]
id = "M033_049"
befehl = ["PRINTCLEAR"]
en = "WHOSE NUMBER DO YOU SAY?"
de = "Wessen Nummer nennt ihr?"

[[text]]
id = "M033_050"
befehl = ["SAVE"]
en = "VILNIKOV"
de = ""

[[text]]
id = "M033_051"
befehl = ["SAVE"]
en = "WILLIAMS"
de = ""

[[text]]
id = "M033_052"
befehl = ["HMENU"]
menue = true
en = "CONCHITEZ"
de = ""

[[text]]
id = "M033_053"
befehl = ["HMENU"]
menue = true
en = "BUCK"
de = ""

[[text]]
id = "M033_054"
befehl = ["HMENU"]
menue = true
en = "CONCHITEZ"
de = ""

[[text]]
id = "M033_055"
befehl = ["HMENU"]
