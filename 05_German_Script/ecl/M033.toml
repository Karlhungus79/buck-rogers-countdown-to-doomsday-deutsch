de = ""

[[text]]
id = "M033_058"
befehl = ["HMENU"]
menue = true
en = "WILLIAMS"
de = ""

[[text]]
id = "M033_059"
befehl = ["HMENU"]
menue = true
en = "BUCK"
de = ""

[[text]]
id = "M033_060"
befehl = ["PRINTCLEAR"]
en = "'"
de = ""

[[text]]
id = "M033_061"
befehl = ["PRINT"]
en = "INVALID SIGMA NUMBER. SECURITY ALERT.' THE LASER SCALPEL ATTACKS. OTHER SURGEONS ACTIVATE."
de = "Ungültige Sigma-Nummer. Sicherheitsalarm.' Das Laserskalpell greift an. Weitere Automaten schalten sich ein."

[[text]]
id = "M033_062"
befehl = ["HMENU"]
menue = true
en = "DESTROY SURGEONS"
de = "Automaten zerstören"

[[text]]
id = "M033_063"
befehl = ["HMENU"]
menue = true
en = "FLEE"
de = "Fliehen"

[[text]]
id = "M033_064"
befehl = ["PRINTCLEAR"]
en = "'REGISTERED DEATH CERTIFICATE. "
de = "'Sterbeurkunde registriert. "

[[text]]
id = "M033_065"
befehl = ["PRINTCLEAR"]
en = "YOU STOP THE LASER FIRE. UNLUCKILY, YOU HAVE NO WAY TO REMOVE THE BRAIN PARASITES."
de = "Ihr stoppt das Laserfeuer. Leider könnt ihr die Hirnparasiten jetzt nicht mehr entfernen."

[[text]]
id = "M033_066"
befehl = ["PRINTCLEAR"]
en = "YOU LEAVE IN A HAIL OF LASER FIRE."
de = "Ihr flieht im Laserhagel."

[[text]]
id = "M033_067"
befehl = ["PRINTCLEAR"]
en = "DEFENSE ROBOTS RESPOND TO THE ALERT."
de = "Abwehrroboter reagieren auf den Alarm."

[[text]]
id = "M033_068"
befehl = ["PRINTCLEAR"]
en = "YOU SHUT IT DOWN. SILENCE DESCENDS AGAIN."
de = "Ihr schaltet ihn ab. Wieder kehrt Stille ein."

[[text]]
id = "M033_069"
befehl = ["WHO"]
en = "WHO WILL REPROGRAM?"
de = "Wer programmiert um?"

[[text]]
id = "M033_070"
befehl = ["PRINTCLEAR"]
en = "THAT ONE IS UNABLE TO."
de = "Diese Figur kann das nicht."

[[text]]
id = "M033_071"
befehl = ["PRINT"]
en = " FAILS. '"
de = " scheitert. '"

[[text]]
id = "M033_072"
befehl = ["PRINTCLEAR"]
en = "THE OPERATION IS QUICK AND SUCCESSFUL. THE OTHERS UNDERGO THE PROCEDURE AND ARE CURED."
de = "Die Operation verläuft schnell und erfolgreich. Die anderen lassen sich ebenfalls behandeln und sind geheilt."

[[text]]
id = "M033_073"
befehl = ["PRINTCLEAR"]
en = "DO YOU WANT BRAIN SURGERY PERFORMED?"
de = "Wollt ihr eine Hirnoperation durchführen lassen?"

[[text]]
id = "M033_074"
befehl = ["PRINTCLEAR"]
en = "DO YOU WANT TO HEAL THE TEAM?"
de = "Wollt ihr das Team heilen?"

[[text]]
id = "M033_075"
befehl = ["PRINTCLEAR"]
en = "THE TEAM IS HEALED."
de = "Das Team ist geheilt."

[[text]]
id = "M033_076"
befehl = ["PRINTCLEAR"]
en = "THIS IS THE MAIN SECURITY CONSOLE. "
de = "Das ist die zentrale Sicherheitskonsole. "

[[text]]
id = "M033_077"
befehl = ["PRINT"]
en = "A ROGUE COULD BYPASS THE PROGRAM AND SHUT DOWN THE ROBOTS HERE. DO YOU TRY?"
de = "Ein Schurke könnte das Programm umgehen und die Roboter hier abschalten. Versucht ihr es?"

[[text]]
id = "M033_078"
befehl = ["WHO"]
en = "WHO WILL TRY?"
de = "Wer versucht es?"

[[text]]
id = "M033_079"
befehl = ["PRINTCLEAR"]
en = "THAT ONE CANNOT."
de = "Diese Figur kann das nicht."

[[text]]
id = "M033_080"
befehl = ["PRINTCLEAR"]
en = "THE SECURITY PROGRAM HAS DETECTED YOUR TAMPERING. "
de = "Das Sicherheitsprogramm hat eure Manipulation bemerkt. "

[[text]]
id = "M033_081"
befehl = ["PRINT"]
en = "BEFORE YOU CAN PULL AWAY,"
de = "Zu spät:"

[[text]]
id = "M033_082"
befehl = ["PRINTCLEAR"]
en = "YOU PULL AWAY AS"
de = "Ihr springt zurück, und"

[[text]]
id = "M033_083"
befehl = ["PRINTCLEAR"]
en = "ROBOTS RUSH OUT FROM A CLOSET SAYING, 'RAM SECURITY VIOLATION. OFFENDERS FACE TERMINATION.'"
de = "Roboter stürmen aus einem Schrank: 'RAM-Sicherheitsverstoß. Den Tätern droht die Eliminierung.'"

[[text]]
id = "M033_084"
befehl = ["PRINTCLEAR"]
en = "THE SECURITY MONITORS ARE DEAD."
de = "Die Sicherheitsmonitore sind tot."

[[text]]
id = "M033_085"
befehl = ["PRINT"]
en = " THE CONSOLE ERUPTS WITH ELECTRICITY."
de = " die Konsole sprüht Blitze."

[[text]]
id = "M033_086"
befehl = ["PRINTCLEAR"]
en = "ROBOTS BURST OUT OF THIS CLOSET AS THE DOOR OPENS."
de = "Als sich die Tür öffnet, stürmen Roboter aus diesem Schrank."

[[text]]
id = "M033_087"
befehl = ["PRINTCLEAR"]
en = "THIS CLOSET IS FILLED WITH INACTIVE SECURITY ROBOTS."
de = "Dieser Schrank ist voller abgeschalteter Sicherheitsroboter."

[[text]]
id = "M033_088"
befehl = ["PRINTCLEAR"]
en = "THIS IS AN EMPTY SECURITY ROBOT CLOSET."
de = "Dies ist ein leerer Schrank für Sicherheitsroboter."

[[text]]
id = "M033_089"
befehl = ["PRINTCLEAR"]
en = "A HOLOGRAM APPEARS. 'I AM SCOT.DOS. I WAS TRYING TO DEFECT TO NEO WHEN SECURITY DETECTED ME."
de = "Ein Hologramm erscheint. 'Ich bin Scot.DOS. Ich wollte zur NEO überlaufen, als die Sicherheit mich entdeckte."

[[text]]
id = "M033_090"
befehl = ["PRINTCLEAR"]
en = "'THE PROGRAM SEALED ME INTO THIS CONSOLE. I CAN HELP YOU IF YOU CONNECT ME TO THE NEXT PANEL.'"
de = "'Das Programm hat mich in dieser Konsole eingesperrt. Ich helfe euch, wenn ihr mich mit dem nächsten Pult verbindet.'"

[[text]]
id = "M033_091"
befehl = ["PRINTCLEAR"]
en = "THIS COMPUTER IS RAM'S BEST. THE CONNECTIONS TO THE NEXT CONSOLE ARE STRANGELY FUSED."
de = "Dies ist der beste Computer von RAM. Die Verbindungen zum nächsten Pult sind seltsam verschmolzen."

[[text]]
id = "M033_092"
befehl = ["PRINTCLEAR"]
en = "YOU CONNECT THE CONSOLES. 'UNTIL THE ECGS ARE DEFEATED WE CANNOT ESCAPE. THEY WILL MOLT SOON TO STAGE 3."
de = "Ihr verbindet die Pulte. 'Solange die ECGs nicht besiegt sind, kommen wir nicht weg. Bald häuten sie sich zu Stufe 3."

[[text]]
id = "M033_093"
befehl = ["PRINTCLEAR"]
en = "'SEARCH FOR RECORDS. DR. WILLIAMS TALKED OF WAYS TO CONTROL THE ECGS.'"
de = "'Sucht nach Aufzeichnungen. Dr. Williams sprach davon, wie man die ECGs kontrollieren kann.'"

[[text]]
id = "M033_094"
befehl = ["PRINTCLEAR"]
en = "'FIRST, LETS SCAN THOSE BIORECORDS YOU FOUND IN MED LAB."
de = "'Zuerst scannen wir die Bioaufzeichnungen, die ihr im Medizinlabor gefunden habt."

[[text]]
id = "M033_095"
befehl = ["PRINTCLEAR"]
en = "'HMM, ARGON GAS WOULD BE EFFECTIVE AGAINST ECGS. ANY WOULD BE ON DECKS 4 OR 1. FEED IT INTO THE AIR PUMPS.'"
de = "'Hmm, Argongas würde gegen ECGs wirken. Welches gäbe es auf Deck 4 oder 1. Leitet es in die Luftpumpen.'"

[[text]]
id = "M033_096"
befehl = ["PRINTCLEAR"]
en = "YOU CANCEL THE DESTRUCT SEQUENCE."
de = "Ihr brecht die Selbstzerstörung ab."

[[text]]
id = "M033_097"
befehl = ["PRINTCLEAR"]
en = ""
de = ""

[[text]]
id = "M033_098"
befehl = ["PRINTCLEAR"]
en = "A SPACESUITED FIGURE IS FIRING AT YOU FROM THE AIRLOCK."
de = "Eine Gestalt im Raumanzug feuert aus der Luftschleuse auf euch."

[[text]]
id = "M033_099"
befehl = ["PRINTCLEAR"]
en = "AS YOU GET CLOSER YOU SEE THAT THE FACE IS EXPRESSIONLESS AND ITS EYES DEAD BLACK."
de = "Als ihr näher kommt, seht ihr: Das Gesicht ist ausdruckslos, die Augen tiefschwarz."

[[text]]
id = "M033_100"
befehl = ["PRINTCLEAR"]
en = "YOU REACH THE STRANGE GENNIE. ANOTHER APPEARS."
de = "Ihr erreicht den seltsamen Gennie. Ein weiterer erscheint."

[[text]]
id = "M033_101"
befehl = ["PRINTCLEAR"]
en = "THERE IS SOMETHING IN THE AIRLOCK. YOU LOOK IN AND SEE..."
de = "In der Luftschleuse ist etwas. Ihr schaut hinein und seht..."

[[text]]
id = "M033_102"
befehl = ["PRINTCLEAR"]
en = "A LONE STAGE 3 IS SETTING A DEMO CHARGE. ITS SOULLESS EYES PEER AT YOU INTENTLY."
de = "Ein einzelner Stufe-3-ECG bringt eine Sprengladung an. Seine seelenlosen Augen mustern euch."

[[text]]
id = "M033_103"
befehl = ["HMENU"]
menue = true
en = "SHOOT IT"
de = "Schießen"

[[text]]
id = "M033_104"
befehl = ["HMENU"]
menue = true
en = "FLEE"
de = "Fliehen"

[[text]]
id = "M033_105"
befehl = ["PRINTCLEAR"]
en = "WHEN HIT, IT FALLS BACK THROUGH THE ESCAPE POD'S CLOSING AIRLOCK. YOU ARE ROCKED BY THE EXPLODING CHARGE AS THE POD DISINTEGRATES."
de = "Getroffen stürzt er durch die sich schließende Schleuse der Rettungskapsel zurück. Die Ladung explodiert, die Kapsel zerbirst."

[[text]]
id = "M033_106"
befehl = ["PRINTCLEAR"]
en = "SCOT APPEARS. 'CONGRATULATIONS! I CAN FIND NO ECGS AT ALL. CONTACT NEO AND FIGURE OUT HOW RAM PLANS TO STERILIZE THE EARTH.'"
de = "Scot erscheint. 'Glückwunsch! Ich finde keine ECGs mehr. Ruft die NEO und findet heraus, wie RAM die Erde sterilisieren will.'"

[[text]]
id = "M033_107"
befehl = ["PRINTCLEAR"]
en = "YOU PILOT THE SHIP BACK TO SALVATION AND GIVE YOUR REPORT."
de = "Ihr fliegt das Schiff zurück nach Salvation und erstattet Bericht."

[[text]]
id = "M033_108"
befehl = ["PRINTCLEAR"]
en = "THE ECG TOSSES THE CHARGE AFTER YOU."
de = "Der ECG wirft euch die Ladung hinterher."

[[text]]
id = "M033_109"
befehl = ["PRINTCLEAR"]
en = ""
de = ""

[[text]]
id = "M033_110"
befehl = ["PRINTCLEAR"]
en = "YOU CRAWL TO THE SHIP'S WEAPONRY CONTROLS. EXPLOSIONS LIGHT UP THE SCREEN AS THE POD FLARES TO INCANDESCENCE."
de = "Ihr kriecht zur Waffensteuerung des Schiffs. Explosionen erhellen den Schirm, als die Kapsel aufglüht."

[[text]]
id = "M033_111"
befehl = ["PRINTCLEAR"]
en = "THE ROOM HOLDS MANY MAINTENANCE TOOLS. SOMETHING CATCHES YOUR EYE TO EITHER SIDE."
de = "Der Raum enthält viele Wartungswerkzeuge. Zu beiden Seiten fällt euch etwas auf."

[[text]]
id = "M033_112"
befehl = ["PRINTCLEAR"]
en = "YOU DISCOVER A SMALL HIDEAWAY. FLOATING WITHIN IS A LOG OF DR. CONCHITEZ. ON THE FINAL PAGE, 'THE RASH...I HAVE LITTLE TIME.'"
de = "Ihr findet ein kleines Versteck. Darin schwebt ein Logbuch von Dr. Conchitez. Letzte Seite: 'Der Ausschlag... mir bleibt wenig Zeit.'"

[[text]]
id = "M033_113"
befehl = ["PRINTCLEAR"]
en = "A PAPER CATCHES YOUR EYE. 'I WISH DR. WILLIAMS REVEALED HOW THE ECGS COULD BE CONTROLLED. HE MUST HAVE RECORDED THE INFORMATION.'"
de = "Ein Zettel fällt euch auf. 'Hätte Dr. Williams nur verraten, wie man die ECGs kontrollieren kann. Er muss es aufgezeichnet haben.'"

[[text]]
id = "M033_114"
befehl = ["PRINTCLEAR"]
en = "THE CARGO BAY IS FILLED WITH EMPTY CANISTERS. ONE ECG COULD FIT IN EACH AND SURVIVE REENTRY."
de = "Der Frachtraum ist voller leerer Behälter. In jeden passt ein ECG und würde den Wiedereintritt überleben."

[[text]]
id = "M033_115"
befehl = ["PRINTCLEAR"]
en = "YOU ARE AT A LADDER."
de = "Ihr steht an einer Leiter."

[[text]]
