befehl = ["PRINTCLEAR"]
en = "YOU PASS A SMALL ASTEROID WITH A PIRATE CRUISER LURKING IN ITS SHADOW. BEFORE YOU CAN REACT, THE CRUISER FIRES!"
de = ""

[[text]]
id = "M050_001"
befehl = ["PRINTCLEAR"]
en = "YOUR ENGINES AND WEAPONS ARE BADLY DAMAGED. THE CRUISER CLOSES AND EXTENDS A BOARDING TUBE. "
