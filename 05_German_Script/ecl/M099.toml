menue = true
en = "MINGLE"
de = "Unterhalten"

[[text]]
id = "M099_061"
befehl = ["HMENU"]
menue = true
en = "EXIT"
de = "Gehen"

[[text]]
id = "M099_062"
befehl = ["PRINTCLEAR"]
en = "THE CROWD IS PRETTY QUIET."
de = "Die Leute sind ziemlich ruhig."

[[text]]
id = "M099_063"
befehl = ["PRINTCLEAR"]
en = "EVERYONE IS WATCHING A NULL-G BOXING MATCH."
de = "Alle schauen einen Boxkampf in Schwerelosigkeit."

[[text]]
id = "M099_064"
befehl = ["PRINTCLEAR"]
en = "THE MUSIC IS TERRIBLE, YOU WANT TO LEAVE."
de = "Die Musik ist furchtbar, ihr wollt gehen."

[[text]]
id = "M099_065"
befehl = ["PRINTCLEAR"]
en = "YOU TALK AND DANCE, BUT FIND LITTLE EXCITEMENT."
de = "Ihr redet und tanzt, aber es ist nicht viel los."

[[text]]
id = "M099_066"
befehl = ["PRINT"]
en = " RUSHES UP. 'YOU LOOK WELL ARMED. I'LL PAY YOU WELL IF YOU TAKE CARE OF SOME TROUBLE.'"
de = " eilt herbei. 'Ihr seht gut bewaffnet aus. Ich zahle gut, wenn ihr mir ein Problem vom Hals schafft.'"

[[text]]
id = "M099_067"
befehl = ["PRINTCLEAR"]
en = "A GROUP RUSHES UP AS "
de = "Eine Gruppe stürmt heran, und "

[[text]]
id = "M099_068"
befehl = ["PRINT"]
en = " DIVES BENEATH YOUR TABLE."
de = " taucht unter euren Tisch."

[[text]]
id = "M099_069"
befehl = ["PRINTCLEAR"]
en = "AS THE DUST SETTLES, "
de = "Als sich der Staub legt, reicht euch "

[[text]]
id = "M099_070"
befehl = ["PRINT"]
en = " HANDS YOU SOME CREDITS. 'THANKS!'"
de = " ein paar Credits. 'Danke!'"

[[text]]
id = "M099_071"
befehl = ["PRINT"]
en = " DARTS AWAY. YOU HEAR A GUN BATTLE RECEDE DOWN THE CORRIDOR."
de = " flitzt davon. Ein Feuergefecht entfernt sich den Gang hinunter."

[[text]]
id = "M099_072"
befehl = ["PRINTCLEAR"]
en = "A BRAWL BEGINS. WEAPONS ARE DRAWN."
de = "Eine Schlägerei bricht aus. Waffen werden gezogen."

[[text]]
id = "M099_073"
befehl = ["HMENU"]
menue = true
en = "FIGHT"
de = "Kämpfen"

[[text]]
id = "M099_074"
befehl = ["HMENU"]
menue = true
en = "LEAVE"
de = "Gehen"

[[text]]
id = "M099_075"
befehl = ["PRINTCLEAR"]
en = "YOU LEAVE BEFORE SECURITY ARRIVES."
de = "Ihr geht, bevor die Sicherheit kommt."

[[text]]
id = "M099_076"
befehl = ["PRINT"]
en = " SLIPS UP TO YOU. 'TRANSMIT THIS TO NEO WHEN YOU CLEAR THE BASE. GOOD LUCK.' "
de = " schleicht zu euch. 'Sendet das an die NEO, wenn ihr von der Basis weg seid. Viel Glück.' "

[[text]]
id = "M099_077"
befehl = ["PRINT"]
en = " DROPS A PACKET AND SLIPS AWAY."
de = " lässt ein Päckchen fallen und verschwindet."

[[text]]
id = "M099_078"
befehl = ["PRINTCLEAR"]
en = "TWO RAM OFFICERS ARE COMMISERATING. 'I NEVER THOUGHT THAT JUSTIN ROBENO WOULD LOSE US ON CERES.'"
de = "Zwei RAM-Offiziere jammern sich gegenseitig vor: 'Hätte nie gedacht, dass Justin Robeno uns auf Ceres entwischt.'"

[[text]]
id = "M099_079"
befehl = ["PRINTCLEAR"]
en = "'HEARD HE MANAGED TO CATCH A FAST TRANSPORT TO FORTUNA.'"
de = "'Er soll einen schnellen Transporter nach Fortuna erwischt haben.'"

[[text]]
id = "M099_080"
befehl = ["PRINTCLEAR"]
en = "YOU SEE A TECHNICIAN BEING DRAGGED OFF BY RAM SECURITY. YOU DRAW YOUR WEAPONS AND ATTACK."
de = "Ihr seht, wie die RAM-Sicherheit einen Techniker abführt. Ihr zieht eure Waffen und greift an."

[[text]]
id = "M099_081"
befehl = ["PRINTCLEAR"]
en = "'I'M JUSTIN ROBENO. WE NEED TO GO TO PAVONIS STARPORT TO RECOVER A KEY PROTOTYPE FOR NEO.'"
de = "'Ich bin Justin Robeno. Wir müssen zum Raumhafen Pavonis, um einen wichtigen Prototyp für die NEO zu holen.'"

[[text]]
id = "M099_082"
befehl = ["PRINTCLEAR"]
en = "A WOMAN WAVES YOU OVER. 'I'M WILMA DEERING. I'VE BEEN EXPECTING YOU. I NEED A DISTRACTION SO I CAN MEET SOMEONE."
de = "Eine Frau winkt euch heran. 'Ich bin Wilma Deering. Ich habe euch erwartet. Ich brauche eine Ablenkung, um jemanden zu treffen."

[[text]]
id = "M099_083"
befehl = ["PRINTCLEAR"]
en = "'A SECURITY ROBOT WILL PASS BY IN THE CORRIDOR. DESTROY IT AND I CAN GET PAST THE SECURITY. HERE IS SOMETHING USEFUL.'"
de = "'Gleich kommt ein Sicherheitsroboter durch den Gang. Zerstört ihn, dann komme ich an der Sicherheit vorbei. Hier, das hilft euch.'"

[[text]]
id = "M099_084"
befehl = ["PRINTCLEAR"]
en = "SHE MOVES OFF."
de = "Sie geht."

[[text]]
id = "M099_085"
befehl = ["PRINTCLEAR"]
en = "YOU ATTACK THE ROBOT."
de = "Ihr greift den Roboter an."

[[text]]
id = "M099_086"
befehl = ["PRINTCLEAR"]
en = "YOU SEE WILMA MEET A DARK MAN AND MOVE OFF."
de = "Ihr seht, wie Wilma einen dunklen Mann trifft und mit ihm geht."

[[text]]
id = "M099_087"
befehl = ["PRINTCLEAR"]
en = "YOU FIND GARRITY FACE DOWN IN A BOOTH. YOU QUESTION HIM ABOUT TALON'S BASE."
de = "Ihr findet Garrity mit dem Gesicht nach unten in einer Nische. Ihr fragt ihn nach Talons Basis."

[[text]]
id = "M099_088"
befehl = ["PRINTCLEAR"]
en = "'IT'S SOMEWHERE IN THE BELT. I GOTTA PASSWORD, BUT IT'LL COST YA.' YOU PAY HIM OFF."
de = "'Irgendwo im Gürtel. Ich hab 'n Passwort, aber das kostet.' Ihr bezahlt ihn."

[[text]]
id = "M099_089"
befehl = ["PRINTCLEAR"]
en = "'THERE'S A HEAVY CRUISER FILLED WITH LOWLANDER PRISONERS AND VALUABLE GRAVITOL.'"
de = "'Da draußen ist ein schwerer Kreuzer voller Tiefländer-Gefangener und wertvollem Gravitol.'"

[[text]]
id = "M099_090"
befehl = ["PRINTCLEAR"]
en = "'DESERT RUNNERS ONLY RESPECT WARRIORS.'"
de = "'Wüstenläufer respektieren nur Krieger.'"

[[text]]
id = "M099_091"
befehl = ["PRINTCLEAR"]
en = "'I ALWAYS CARRY AT LEAST THREE NEEDLE GUNS,' BOASTS A MERCENARY."
de = "'Ich trage immer mindestens drei Nadelpistolen', prahlt ein Söldner."

[[text]]
id = "M099_092"
befehl = ["PRINTCLEAR"]
en = "'ACID FROGS ATTACK ANYTHING THAT MOVES.'"
de = "'Säurefrösche greifen alles an, was sich bewegt.'"

[[text]]
id = "M099_093"
befehl = ["PRINTCLEAR"]
en = "'ALWAYS SPREAD OUT YOUR TEAM IN COMBAT! AND PROTECT THE MEDIC!'"
de = "'Verteilt euer Team im Kampf! Und beschützt den Sanitäter!'"

[[text]]
id = "M099_094"
befehl = ["PRINTCLEAR"]
en = "A YOUNG PIRATE BOASTS, 'TALON'S ALL TALK, HE'S REALLY A WEAKLING.'"
de = "Ein junger Pirat prahlt: 'Talon redet nur. In Wahrheit ist er ein Schwächling.'"

[[text]]
id = "M099_095"
befehl = ["PRINTCLEAR"]
en = "'THE ACID FROG KING IS AN AWE INSPIRING AMPHIBIAN. HIGHLY INTELLIGENT AND RESPECTFUL OF LEADERS.'"
de = "'Der Säurefroschkönig ist eine ehrfurchtgebietende Amphibie. Hochintelligent und achtet Anführer.'"

[[text]]
id = "M099_096"
befehl = ["PRINTCLEAR"]
en = "'BUCK ROGERS AND WILMA DEERING ARE SECRETLY ENGAGED.'"
de = "'Buck Rogers und Wilma Deering sind heimlich verlobt.'"

[[text]]
id = "M099_097"
befehl = ["PRINTCLEAR"]
en = "CARE TO SEARCH THE STACKS?"
de = "Wollt ihr die Regale durchsuchen?"

[[text]]
id = "M099_098"
befehl = ["PRINTCLEAR"]
en = "YOU SEARCH THE STACKS FOR ANY IMPORTANT INFORMATION."
de = "Ihr durchsucht die Regale nach wichtigen Informationen."

[[text]]
id = "M099_099"
befehl = ["PRINTCLEAR"]
en = "YOU SEARCH, BUT YOU FIND NOTHING NEW."
de = "Ihr sucht, findet aber nichts Neues."

[[text]]
id = "M099_100"
befehl = ["PRINTCLEAR"]
en = "YOU SEARCH, BUT YOU FIND NOTHING INTERESTING."
de = "Ihr sucht, findet aber nichts Interessantes."

[[text]]
id = "M099_101"
befehl = ["PRINT"]
en = " FINDS SOME INTERESTING INFORMATION."
de = " findet interessante Informationen."

[[text]]
id = "M099_102"
befehl = ["PRINTCLEAR"]
en = "DESERT RUNNERS ARE PROVOKED BY PROLONGED CONVERSATION."
de = "Wüstenläufer fühlen sich durch lange Gespräche herausgefordert."

[[text]]
id = "M099_103"
befehl = ["PRINTCLEAR"]
en = "A LARGE COMMUNITY OF ACID FROGS INHABIT THE CENTRAL LAKE OF THE VENUSIAN LOWLANDS."
de = "Im zentralen See des venusianischen Tieflands lebt eine große Kolonie Säurefrösche."

[[text]]
id = "M099_104"
befehl = ["PRINTCLEAR"]
en = "A SHOP ON JUNO SELLS BOTH CHAFF GRENADES AND ECM'S FOR A STIFF PRICE."
de = "Ein Laden auf Juno verkauft Düppelgranaten und ECM-Pakete, zu gesalzenen Preisen."

[[text]]
id = "M099_105"
befehl = ["PRINTCLEAR"]
en = "RAM CRUISERS ALWAYS REPAIR WEAPONS BEFORE ANY OTHER DAMAGED SYSTEMS."
de = "RAM-Kreuzer reparieren immer zuerst ihre Waffen, dann andere beschädigte Systeme."

[[text]]
id = "M099_106"
befehl = ["PRINTCLEAR"]
en = "THERE IS A RAM SCIENCE LAB IN THE SOUTHWESTERN VENUS LOWLANDS."
de = "Im südwestlichen Tiefland der Venus gibt es ein RAM-Forschungslabor."

[[text]]
id = "M099_107"
befehl = ["PRINTCLEAR"]
en = "RAM HAS BUILT A SECRET COMMUNICATIONS BASE ON HYGEIA."
de = "RAM hat auf Hygeia eine geheime Funkbasis gebaut."

[[text]]
id = "M099_108"
befehl = ["PRINTCLEAR"]
en = "ACID FROGS ARE EASILY DOMESTICATED BY EXPERTS IN LEADERSHIP."
de = "Säurefrösche lassen sich von Fachleuten für Führung leicht zähmen."

[[text]]
id = "M099_109"
befehl = ["PRINTCLEAR"]
en = "SUN KINGS RULE THE MERCURIAN MARIPOSAS. MANY DIFFERENT LANGUAGES ARE SPOKEN THERE."
de = "Sonnenkönige herrschen über die Mariposas am Merkur. Dort werden viele verschiedene Sprachen gesprochen."

[[text]]
id = "M099_110"
befehl = ["PRINTCLEAR"]
en = "JUSTIN RUMMAGES AROUND AND FINDS THE PROTOTYPE. SUDDENLY, RAM FORCES RUSH INTO THE ROOM."
de = "Justin kramt herum und findet den Prototyp. Plötzlich stürmen RAM-Truppen in den Raum."

[[text]]
id = "M099_111"
befehl = ["PRINTCLEAR"]
en = "ONE SAYS, 'WE KNEW THAT WITH THE PROTOTYPE AS BAIT, WE COULD COLLECT NEO SPIES!'"
de = "Einer sagt: 'Wir wussten, dass wir mit dem Prototyp als Köder NEO-Spione fangen!'"

[[text]]
id = "M099_112"
befehl = ["PRINTCLEAR"]
en = "YOU DRAW YOUR WEAPONS."
de = "Ihr zieht eure Waffen."

[[text]]
id = "M099_113"
befehl = ["PRINTCLEAR"]
en = "JUSTIN HOLDS UP THE UNDAMAGED DEVICE, 'LET'S GET OUT OF HERE BEFORE MORE TROOPS SHOW UP.'"
de = "Justin hält das unversehrte Gerät hoch. 'Nichts wie weg, bevor noch mehr Truppen kommen.'"

[[text]]
id = "M099_114"
befehl = ["PRINTCLEAR"]
en = "TROOPS TRY TO PREVENT YOU FROM REACHING YOUR SHIP."
de = "Truppen wollen euch daran hindern, euer Schiff zu erreichen."

[[text]]
id = "M099_115"
befehl = ["PRINTCLEAR"]
en = "YOU RUSH ONTO YOUR SHIP BEFIRE MORE ARRIVE."
de = "Ihr stürmt auf euer Schiff, bevor weitere kommen."

[[text]]
id = "M099_116"
befehl = ["PRINTCLEAR"]
en = "GOOD DAY."
de = "Guten Tag."

[[text]]
