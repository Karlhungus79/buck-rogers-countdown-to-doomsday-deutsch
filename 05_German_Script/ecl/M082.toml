# Buck Rogers: Countdown to Doomsday - deutscher Dialogtext, ECL-Modul 82
# de = deutscher Text (leer = englisches Original bleibt). en = nur Referenz, nicht aendern.
# Zeichen: normale Gross-/Kleinschreibung, ä ö ü Ä Ö Ü, ß; \n = Zeilenumbruch (nur wo das Original einen hat).

[[text]]
id = "M082_000"
befehl = ["PRINTCLEAR"]
en = "THE TUNNEL ENDS IN A SMALL BARRACK. "
de = "Der Tunnel endet in einer kleinen Unterkunft. "

[[text]]
id = "M082_001"
befehl = ["PRINTCLEAR"]
en = "THE WALLS ON EITHER SIDE OF YOU BEAR THE RAM INSIGNIA."
de = "Die Wände zu beiden Seiten tragen das RAM-Emblem."

[[text]]
id = "M082_002"
befehl = ["PRINTCLEAR"]
en = "THE EXPLOSIONS IN THE HANGAR ALERTED RAM TO YOUR PRESENCE! YOU ARE AMBUSHED!"
de = "Die Explosionen im Hangar haben RAM alarmiert! Ein Hinterhalt!"

[[text]]
id = "M082_003"
befehl = ["PRINTCLEAR"]
en = "A RAM HIT TEAM HAS BEEN LYING IN WAIT FOR YOU INSIDE THE DOOR. YOU ARE AMBUSHED!"
de = "Ein RAM-Killerkommando hat hinter der Tür auf euch gelauert. Ein Hinterhalt!"

[[text]]
id = "M082_004"
befehl = ["PRINTCLEAR"]
en = "YOU HEAR BOOTS CLICKING ON THE FLOOR NEARBY."
de = "In der Nähe klacken Stiefel über den Boden."

[[text]]
id = "M082_005"
befehl = ["PRINTCLEAR"]
en = "A FAILED LAB EXPERIMENT SLITHERS BY."
de = "Ein misslungenes Laborexperiment schlängelt vorbei."

[[text]]
id = "M082_006"
befehl = ["PRINTCLEAR"]
en = "THE RAM INSIGNIA IS PRINTED ON THE WALL."
de = "An der Wand prangt das RAM-Emblem."

[[text]]
id = "M082_007"
befehl = ["PRINTCLEAR"]
en = "YOUR STOMACH GRUMBLES."
de = "Euer Magen knurrt."

[[text]]
id = "M082_008"
befehl = ["PRINTCLEAR"]
en = "YOU CRAVE MORE JUNK FOOD."
de = "Ihr habt Heißhunger auf mehr Junkfood."

[[text]]
id = "M082_009"
befehl = ["PRINTCLEAR"]
en = "YOU HEAR A CRASH IN THE DISTANCE."
de = "In der Ferne kracht es."

[[text]]
id = "M082_010"
befehl = ["PRINTCLEAR"]
en = "YOU HEAR MURMURING CLOSE BY. YOU PRESS YOUR EAR TO THE WALL AND CATCH SOMETHING ABOUT PRISONERS ON LEVEL THREE."
de = "Ganz nah hört ihr Gemurmel. Ihr presst das Ohr an die Wand und schnappt etwas über Gefangene auf Ebene drei auf."

[[text]]
id = "M082_011"
befehl = ["PRINTCLEAR"]
en = "SOME ONE DREW A MOUSTACHE ON THE RAM INSIGNIA PRINTED ON THE WALL."
de = "Jemand hat dem RAM-Emblem an der Wand einen Schnurrbart gemalt."

[[text]]
id = "M082_012"
befehl = ["PRINTCLEAR"]
en = "YOU FIND A CACHE OF JUNK FOOD. EAT IT?"
de = "Ihr findet einen Vorrat Junkfood. Essen?"

[[text]]
id = "M082_013"
befehl = ["PRINTCLEAR"]
en = "YOU GOBBLE DOWN THE JUNK FOOD."
de = "Ihr schlingt das Junkfood hinunter."

[[text]]
id = "M082_014"
befehl = ["PRINTCLEAR"]
en = "YOU LEAVE THE JUNK FOOD BEHIND."
de = "Ihr lasst das Junkfood liegen."

[[text]]
id = "M082_015"
befehl = ["PRINTCLEAR"]
en = "YOU FIND ANOTHER CACHE OF JUNK FOOD! EAT IT?"
de = "Ihr findet noch einen Vorrat Junkfood! Essen?"

[[text]]
id = "M082_016"
befehl = ["PRINTCLEAR"]
en = "YOU GET A STOMACH ACHE."
de = "Ihr bekommt Bauchweh."

[[text]]
id = "M082_017"
befehl = ["PRINTCLEAR"]
en = "AN ACIDICIUM IS SLIDING ACROSS THE HALL UP AHEAD."
de = "Vorn im Gang gleitet ein Acidicium vorbei."

[[text]]
id = "M082_018"
befehl = ["PRINTCLEAR"]
en = "GRAFFITI ON THE WALL READS: "
de = "Ein Graffito an der Wand: "

[[text]]
id = "M082_019"
befehl = ["PRINT"]
en = "KILROY.DOS WAS HERE."
de = "Kilroy.DOS war hier."

[[text]]
id = "M082_020"
befehl = ["PRINTCLEAR"]
en = "YOU FIND BOOTS COVERED WITH YELLOW ACID SCUM."
de = "Ihr findet Stiefel voller gelbem Säureschaum."

[[text]]
id = "M082_021"
befehl = ["PRINTCLEAR"]
en = "AN INTERCOM BUZZES AND CRACKLES."
de = "Eine Sprechanlage summt und knistert."

[[text]]
id = "M082_022"
befehl = ["PRINTCLEAR"]
en = "YOU HAVE A PREMONITION OF DANGER."
de = "Ihr ahnt Gefahr."

[[text]]
id = "M082_023"
befehl = ["PRINTCLEAR"]
en = "RAM WARRIORS SEE YOU AND ATTACK!"
de = "RAM-Krieger sehen euch und greifen an!"

[[text]]
id = "M082_024"
befehl = ["PRINTCLEAR"]
en = "ACIDICIUM SENSE YOU AND ATTACK!"
de = "Acidicium wittern euch und greifen an!"

[[text]]
id = "M082_025"
befehl = ["PRINTCLEAR"]
en = "YOU ARE DETECTED BY SECURITY ROBOTS!"
de = "Sicherheitsroboter entdecken euch!"

[[text]]
id = "M082_026"
befehl = ["PRINTCLEAR"]
en = "THERE ARE FOUR BUTTONS IN THE ELEVATOR."
de = "Im Aufzug sind vier Knöpfe."

[[text]]
id = "M082_027"
befehl = ["HMENU"]
menue = true
en = "1"
de = ""

[[text]]
id = "M082_028"
befehl = ["HMENU"]
menue = true
en = "2"
de = ""

[[text]]
id = "M082_029"
befehl = ["HMENU"]
menue = true
en = "3"
de = ""

[[text]]
id = "M082_030"
befehl = ["HMENU"]
menue = true
en = "4"
de = ""

[[text]]
id = "M082_031"
befehl = ["HMENU"]
menue = true
en = "NONE"
de = "Keiner"

[[text]]
id = "M082_032"
befehl = ["PRINTCLEAR"]
en = "A RECORDED VOICE SAYS, 'IF YOU DO NOT WISH TO USE THE ELEVATOR, PLEASE VACATE IT IMMEDIATELY.'"
de = "Eine Ansage: 'Wenn Sie den Aufzug nicht benutzen möchten, verlassen Sie ihn bitte sofort.'"

[[text]]
id = "M082_033"
befehl = ["PRINTCLEAR"]
en = "A RECORDED VOICE SAYS, 'YOU ARE ALREADY ON THAT FLOOR. PLEASE TRY ANOTHER.'"
de = "Eine Ansage: 'Sie befinden sich bereits auf dieser Etage. Bitte wählen Sie eine andere.'"

[[text]]
id = "M082_034"
befehl = ["PRINTCLEAR"]
en = "THE ELEVATOR WHIRRS AND YOU ARRIVE ON THE FIRST FLOOR."
de = "Der Aufzug surrt, ihr erreicht die erste Etage."

[[text]]
id = "M082_035"
befehl = ["PRINTCLEAR"]
en = "THE ELEVATOR WHIRRS AND YOU ARRIVE ON THE SECOND FLOOR."
de = "Der Aufzug surrt, ihr erreicht die zweite Etage."

[[text]]
id = "M082_036"
befehl = ["PRINTCLEAR"]
en = "THE ELEVATOR WHIRRS AND YOU ARRIVE ON THE THIRD FLOOR."
de = "Der Aufzug surrt, ihr erreicht die dritte Etage."

[[text]]
id = "M082_037"
befehl = ["PRINTCLEAR"]
en = "THE ELEVATOR CHUGS AND LURCHES BEFORE ARRIVING ON THE FOURTH FLOOR."
de = "Der Aufzug ruckelt und schlingert, bevor er die vierte Etage erreicht."

[[text]]
id = "M082_038"
befehl = ["PRINTCLEAR"]
en = "'FLOOR 1 -- LABS.' "
de = "'Etage 1 -- Labore.' "

[[text]]
id = "M082_039"
befehl = ["PRINTCLEAR"]
en = "'FLOOR 2 -- BARRACKS.'"
de = "'Etage 2 -- Unterkünfte.'"

[[text]]
id = "M082_040"
befehl = ["PRINTCLEAR"]
en = "'FLOOR 3 -- ADMINISTRATIVE OFFICES.'"
de = "'Etage 3 -- Verwaltung.'"

[[text]]
id = "M082_041"
befehl = ["PRINTCLEAR"]
en = "'DANGER -- UNDER CONSTRUCTION.' "
de = "'Gefahr -- Baustelle.' "

[[text]]
id = "M082_042"
befehl = ["PRINTCLEAR"]
en = "'ACIDICIUM COMPOUND AHEAD.'"
de = "'Achtung: Acidicium-Gehege.'"

[[text]]
id = "M082_043"
befehl = ["PRINTCLEAR"]
en = "'COMBAT ROBOTS AHEAD (DANGER).'"
de = "'Achtung: Kampfroboter (Gefahr).'"

[[text]]
id = "M082_044"
befehl = ["PRINTCLEAR"]
en = "ACIDICIUM OOZE TOWARDS YOU IN A SLIMY MASS."
de = "Acidicium kriechen als schleimige Masse auf euch zu."

[[text]]
id = "M082_045"
befehl = ["PRINTCLEAR"]
en = "THE FLOOR IS LITTERED WITH BUBBLING ACIDICIUM CORPSES."
de = "Der Boden ist übersät mit blubbernden Acidicium-Leichen."

[[text]]
id = "M082_046"
befehl = ["PRINTCLEAR"]
en = "GUARD ROBOTS ZERO IN ON YOU. "
de = "Wachroboter nehmen euch ins Visier. "

[[text]]
id = "M082_047"
befehl = ["PRINTCLEAR"]
en = "ROBOT BITS ARE SCATTERED ALL OVER THE ROOM."
de = "Roboterteile liegen überall im Raum verstreut."

[[text]]
id = "M082_048"
befehl = ["PRINTCLEAR"]
en = "THIS SECURITY DOOR OPENS WHEN YOU FIND THE CORRECT KEY IN YOUR KEYRING."
de = "Diese Sicherheitstür öffnet sich, als ihr den richtigen Schlüssel am Bund findet."

[[text]]
id = "M082_049"
befehl = ["PRINTCLEAR"]
en = "A SIGN ON THE DOOR READS: TO ELEVATOR"
de = "Ein Schild an der Tür: Zum Aufzug"

[[text]]
id = "M082_050"
befehl = ["PRINTCLEAR"]
en = "THIS SECURITY DOOR IS IMPERVIOUS EVEN TO A DEMO CHARGE. IT WON'T OPEN."
de = "Diese Sicherheitstür widersteht sogar einer Sprengladung. Sie geht nicht auf."

[[text]]
id = "M082_051"
befehl = ["PRINTCLEAR"]
en = "THIS IS THE MAIN EXIT FROM THE BASE, LEADING UP TO THE VENUSIAN JUNGLE. WILL YOU LEAVE THE BASE?"
de = "Das ist der Hauptausgang der Basis, hinauf in den Dschungel der Venus. Wollt ihr die Basis verlassen?"

[[text]]
id = "M082_052"
befehl = ["PRINTCLEAR"]
en = "BEYOND THIS DOOR LIES A DARK TUNNEL DRIPPING WITH ACID. ENTER THE TUNNEL?"
de = "Hinter dieser Tür liegt ein dunkler Tunnel, aus dem Säure tropft. Hineingehen?"

[[text]]
id = "M082_053"
befehl = ["PRINTCLEAR"]
en = "THE LOWLANDER SCIENTISTS WILL STAY HERE UNTIL YOU BRING WORD TO THEM FROM LANDON."
de = "Die Tiefländer-Forscher bleiben hier, bis ihr ihnen Nachricht von Landon bringt."

[[text]]
id = "M082_054"
befehl = ["PRINTCLEAR"]
en = "A GROUP OF LOWLANDER SCIENTISTS ARE IMPRISONED HERE. 'SSAVE USS FROM RAM!' THEY PLEAD."
de = "Hier sind Tiefländer-Forscher eingesperrt. 'Rettet unss vor RAM!', flehen sie."

[[text]]
id = "M082_055"
befehl = ["PRINTCLEAR"]
en = "'ANOTHER IN OUR GROUP, LANDON, ESCAPED. HE SEEKS AN ESCAPE ROUTE ON THE FOURTH LEVEL."
de = "'Einer von unss, Landon, isst entkommen. Er ssucht auf der vierten Ebene einen Fluchtweg."

[[text]]
id = "M082_056"
befehl = ["PRINTCLEAR"]
en = "'HE'LL COME TO YOU IF HE HEARS YOU TAP THE VICTORY CODE ON THE WALL. WE'LL TEACH IT TO YOU.' YOU LEARN THE VICTORY CODE."
de = "'Er kommt zu euch, wenn er hhört, wie ihr den Ssiegescode an die Wand klopft. Wir bringen ihn euch bei.' Ihr lernt den Siegescode."

[[text]]
id = "M082_057"
befehl = ["PRINTCLEAR"]
en = "THE LOWLANDER SCIENTISTS HURRY TO MEET LANDON."
de = "Die Tiefländer-Forscher eilen zu Landon."

[[text]]
id = "M082_058"
befehl = ["PRINTCLEAR"]
en = "YOU TAP THE LOWLANDER CODE, AND LANDON CAUTIOUSLY APPROACHES. "
de = "Ihr klopft den Tiefländer-Code, und Landon nähert sich vorsichtig. "

[[text]]
id = "M082_059"
befehl = ["PRINTCLEAR"]
en = "'PLEASSE GO TO TOWN AND RESCUE MY SSON, ZANE.' LANDON WILL DISCUSS NOTHING ELSE."
de = "'Bitte geht ins Dorf und rettet meinen Ssohn Zane.' Über anderes will Landon nicht reden."

[[text]]
id = "M082_060"
befehl = ["COMPARE"]
en = "ZANE"
de = ""

[[text]]
id = "M082_061"
befehl = ["PRINTCLEAR"]
en = "LANDON EMBRACES ZANE. 'MY SSON! THANK YOU FOR SSAVING HIM.' ZANE LEAVES THE TEAM TO REJOIN HIS FATHER."
de = "Landon umarmt Zane. 'Mein Ssohn! Danke, dass ihr ihhn gerettet hhabt.' Zane verlässt das Team und bleibt bei seinem Vater."

[[text]]
id = "M082_062"
befehl = ["PRINTCLEAR"]
en = "'AS A REWARD, "
de = "'Zum Dank: "

[[text]]
id = "M082_063"
befehl = ["PRINT"]
en = "I'LL TELL YOU WHERE I'VE HIDDEN ONE OF RAM'SS RETINAL LOCKPICKSS. IT ISS VERY IMPORTANT TO THHEM."
de = "Ich verrate euch, wo ich einen RAM-Netzhautdietrich versteckt hhabe. Er isst ssehr wichtig für ssie."

[[text]]
id = "M082_064"
befehl = ["PRINTCLEAR"]
en = "'THE LOCKPICK IS HIDDEN UNDER A FLOOR PANEL IN LABORATORY TWO, ON THE FIRST FLOOR. WHEN YOU GET IT, MEET ME BACK HHERE.'"
de = "'Der Dietrich liegt unter einer Bodenplatte in Labor zwei, auf der ersten Etage. Wenn ihr ihhn habt, trefft mich wieder hhier.'"

[[text]]
id = "M082_065"
befehl = ["PRINTCLEAR"]
en = "LANDON ASKS IF YOU'VE SEEN HIS SON, ZANE. YOU TELL HIM OF ZANE'S FATE AND HE REELS WITH GRIEF. 'AT LEASST YOU TRIED TO HHELP HHIM.'"
de = "Landon fragt nach seinem Sohn Zane. Ihr erzählt ihm von Zanes Schicksal, er wankt vor Kummer. 'Wenigsstens habt ihr es verssucht.'"

[[text]]
id = "M082_066"
befehl = ["PRINTCLEAR"]
en = "'"
de = ""

[[text]]
id = "M082_067"
befehl = ["PRINTCLEAR"]
en = "'GET THE RETINAL LOCKPICK. THHEN WE'LL FIND THE SSECRET TUNNEL.'"
de = "'Hholt den Netzhautdietrich. Dann ssuchen wir den geheimen Tunnel.'"

[[text]]
id = "M082_068"
befehl = ["PRINTCLEAR"]
en = "'SSOMEWHERE ON THIS LEVEL IS A SSECRET DOOR. FIND IT AND MEET ME HHERE.'"
de = "'Irgendwo auf dieser Ebene isst eine Geheimtür. Findet ssie und trefft mich hhier.'"

[[text]]
id = "M082_069"
befehl = ["PRINTCLEAR"]
en = "'YOU FOUND THE SSECRET DOOR! PLEASSE BRING THE OTHHER TECHHNICIANSS SSO WE CAN ESSCAPE!'"
de = "'Ihr habt die Geheimtür gefunden! Bitte hholt die anderen Techhniker, damit wir fliehen können!'"

[[text]]
id = "M082_070"
befehl = ["PRINT"]
en = "'PLEASSE BRING THE OTHHER TECHHNICIANSS HHERE.'"
de = "'Bitte bringt die anderen Techhniker hhierher.'"

[[text]]
id = "M082_071"
befehl = ["PRINTCLEAR"]
en = "LANDON APPROACHES. 'WE'RE LEAVING NOW. I'M SSORRY, BUT THE ACID IN THE TUNNEL ISS TOO STRONG FOR YOU TO FOLLOW. THHANK YOU FOR YOUR HHELP.'"
de = "Landon kommt näher. 'Wir gehen jetzt. Tut mir leid, aber die Ssäure im Tunnel isst zu sstark für euch. Danke für eure Hhilfe.'"

[[text]]
id = "M082_072"
befehl = ["COMPARE"]
en = "LEANDER"
de = ""

[[text]]
id = "M082_073"
befehl = ["PRINTCLEAR"]
en = "LEANDER ADDRESSES YOU. 'I MUSST LEAVE YOU NOW AND SSTAY WITHH MY PEOPLE. I HHOPE YOU SSUCCEED IN YOUR MISSSION.'"
de = "Leander wendet sich an euch. 'Ich musss euch jetzt verlassen und bei meinem Volk bleiben. Ich hhoffe, eure Mission gelingt.'"

[[text]]
id = "M082_074"
befehl = ["PRINTCLEAR"]
en = "SCOT.DOS CONTACTS YOU BY RADIO. 'THERE'S NOT MUCH MORE TO DO HERE ON VENUS, SO MEET ME BACK AT THE SHIP AS SOON AS YOU CAN.'"
de = "Scot.DOS meldet sich per Funk. 'Auf der Venus gibt es nicht mehr viel zu tun. Kommt so schnell wie möglich zurück zum Schiff.'"

[[text]]
id = "M082_075"
befehl = ["PRINTCLEAR"]
en = "EXAMINING THE WALL CLOSELY, YOU FIND A CONCEALED LATCH. THIS MUST BE THE SECRET DOOR!"
de = "Bei genauem Hinsehen findet ihr einen verborgenen Riegel in der Wand. Das muss die Geheimtür sein!"

[[text]]
id = "M082_076"
befehl = ["PRINTCLEAR"]
en = "UNDER A FLOOR PANEL YOU FIND A RAM RETINAL LOCKPICK! YOU NEVER WOULD HAVE FOUND IT WITHOUT LANDON'S DIRECTIONS."
de = "Unter einer Bodenplatte findet ihr einen RAM-Netzhautdietrich! Ohne Landons Hinweis hättet ihr ihn nie gefunden."

[[text]]
id = "M082_077"
befehl = ["PRINTCLEAR"]
en = "YOU HAVE A RETINAL LOCKPICK."
de = "Ihr habt einen Netzhautdietrich."

[[text]]
id = "M082_078"
befehl = ["PRINTCLEAR"]
en = "THIS MEETING ROOM IS FULL OF RAM OFFICERS. THEY POINT WEAPONS AT YOU AND ORDER YOU TO SURRENDER. "
de = "Dieser Besprechungsraum ist voller RAM-Offiziere. Sie richten Waffen auf euch und fordern eure Kapitulation. "

[[text]]
id = "M082_079"
befehl = ["HMENU"]
menue = true
en = "SURRENDER"
de = "Ergeben"

[[text]]
id = "M082_080"
befehl = ["HMENU"]
menue = true
en = "RUN"
de = "Rennen"

[[text]]
id = "M082_081"
befehl = ["HMENU"]
menue = true
en = "FIGHT"
de = "Kämpfen"

[[text]]
id = "M082_082"
befehl = ["PRINTCLEAR"]
en = "CONFIDENTLY DRAWING YOUR WEAPONS, YOU WADE INTO THEIR MIDST."
de = "Selbstbewusst zieht ihr die Waffen und stürzt euch mitten unter sie."

[[text]]
id = "M082_083"
befehl = ["PRINTCLEAR"]
en = "YOU TURN AND RUN. THEY FIRE AFTER YOU, AND SOUND AN ALARM!"
de = "Ihr dreht euch um und rennt. Sie feuern hinter euch her und lösen Alarm aus!"

[[text]]
id = "M082_084"
befehl = ["PRINTCLEAR"]
en = ""
de = ""

[[text]]
id = "M082_085"
befehl = ["PRINTCLEAR"]
en = "THE OFFICERS VOTE UNANIMOUSLY FOR YOUR IMMEDIATE EXECUTION."
de = "Die Offiziere stimmen einstimmig für eure sofortige Hinrichtung."

[[text]]
id = "M082_086"
befehl = ["PRINTCLEAR"]
en = ""
de = ""

[[text]]
id = "M082_087"
befehl = ["PRINTCLEAR"]
en = "ACIDICIUM ARE BUSILY CONSUMING THE BODIES IN THIS ROOM. THEY LEAVE BEHIND SMOLDERING SKELETONS."
de = "Acidicium fressen eifrig die Leichen in diesem Raum. Zurück bleiben qualmende Skelette."

[[text]]
id = "M082_088"
befehl = ["PRINTCLEAR"]
en = "THIS IS AN EIGHT-MAN RAM BARRACK."
de = "Das ist eine RAM-Unterkunft für acht Mann."

[[text]]
id = "M082_089"
befehl = ["PRINTCLEAR"]
en = "YOU'VE INTERRUPTED SOME RAM OFFICERS. THEY LUNGE TOWARDS YOU."
de = "Ihr stört ein paar RAM-Offiziere. Sie stürzen sich auf euch."

[[text]]
id = "M082_090"
befehl = ["PRINTCLEAR"]
en = "THIS IS A SMALL OFFICE. "
de = "Das ist ein kleines Büro. "

[[text]]
id = "M082_091"
befehl = ["PRINT"]
en = "A FEW RAM ASSASSINS DRAW THEIR WEAPONS AND CHARGE YOU. "
de = "Einige RAM-Attentäter ziehen ihre Waffen und stürmen auf euch los. "

[[text]]
id = "M082_092"
befehl = ["PRINTCLEAR"]
en = "THREE RAM WARRIORS REACH FOR THEIR WEAPONS, BUT HESITATE AFTER ASSESSING THE TEAM'S STRENGTH. YOU'RE AT A STAND OFF."
de = "Drei RAM-Krieger greifen nach ihren Waffen, zögern aber, als sie die Stärke des Teams einschätzen. Patt."

[[text]]
id = "M082_093"
befehl = ["HMENU"]
menue = true
en = "LEAVE"
de = "Gehen"

[[text]]
id = "M082_094"
befehl = ["HMENU"]
menue = true
en = "ATTACK"
de = "Angreifen"

[[text]]
id = "M082_095"
befehl = ["HMENU"]
menue = true
en = "INTIMIDATE THEM"
de = "Einschüchtern"

[[text]]
id = "M082_096"
befehl = ["PRINTCLEAR"]
en = "THE WARRIORS ARE ENCOURAGED BY YOUR OBVIOUS SHOW OF COWARDICE. THEY ATTACK!"
de = "Eure offensichtliche Feigheit ermutigt die Krieger. Sie greifen an!"

[[text]]
id = "M082_097"
befehl = ["PRINTCLEAR"]
en = "THE WARRIORS ARE ALARMED AND LOOK FOR A WAY TO ESCAPE."
de = "Die Krieger sind beunruhigt und suchen einen Fluchtweg."

[[text]]
id = "M082_098"
befehl = ["PRINTCLEAR"]
en = "'I'VE BEEN SCANNING THE RAM MAINFRAME. I FOUND REFERENCES TO THE DOOMSDAY DEVICE ON THE THIRD MERCURIAN MARIPOSA.'"
de = "'Ich habe den RAM-Großrechner durchsucht. Es gibt Hinweise auf die Doomsday-Waffe auf der dritten Mariposa am Merkur.'"

[[text]]
id = "M082_099"
befehl = ["PRINTCLEAR"]
en = "YOUR EFFORTS AT INTIMIDATION AMUSE THE WARRIORS. THEY ATTACK!"
de = "Eure Einschüchterungsversuche amüsieren die Krieger. Sie greifen an!"

[[text]]
id = "M082_100"
befehl = ["PRINTCLEAR"]
en = "THE WARRIORS ARE INTIMIDATED. THEY BEG FOR MERCY."
de = "Die Krieger sind eingeschüchtert. Sie flehen um Gnade."

[[text]]
id = "M082_101"
befehl = ["HMENU"]
menue = true
en = "SHOW MERCY"
de = "Gnade zeigen"

[[text]]
id = "M082_102"
befehl = ["HMENU"]
menue = true
en = "ATTACK"
de = "Angreifen"

[[text]]
id = "M082_103"
befehl = ["PRINTCLEAR"]
en = "THE WARRIORS CAN'T BE TRUSTED. YOU ATTACK."
de = "Den Kriegern ist nicht zu trauen. Ihr greift an."

[[text]]
id = "M082_104"
befehl = ["PRINTCLEAR"]
en = "YOU BIND AND GAG THE WARRIORS AND LOCK THEM IN THE CLOSET."
de = "Ihr fesselt und knebelt die Krieger und sperrt sie in den Schrank."

[[text]]
id = "M082_105"
befehl = ["PRINTCLEAR"]
en = "THREE RAM WARRIORS ARE BOUND AND GAGGED ON THE FLOOR OF THIS CLOSET."
