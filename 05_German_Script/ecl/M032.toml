id = "M032_022"
befehl = ["PRINTCLEAR"]
en = "NEAR THE CORPSE IS A RECORDER AND A HOLOGRAPHIC PROJECTOR. BITS OF TAPE FLOAT AROUND THE ROOM."
de = ""

[[text]]
id = "M032_023"
befehl = ["PRINTCLEAR"]
en = "'...WE WILL BE ON SCHEDULE FOR DEPLOYMENT AFTER EARTH'S STERILIZATION.'"
