[[text]]
id = "M032_039"
befehl = ["PRINTCLEAR"]
en = "YOU COULD JUST FIT INTO THE AIRSHAFT. "
de = "Ihr würdet gerade so in den Luftschacht passen. "

[[text]]
id = "M032_040"
befehl = ["PRINT"]
en = "YOU HAVE TO TRAVEL IN SINGLE FILE. SOMEONE MAY HAVE TO FIGHT ALONE. "
de = "Ihr müsst hintereinander gehen. Vielleicht muss jemand allein kämpfen. "

[[text]]
id = "M032_041"
befehl = ["PRINT"]
en = "DO YOU ENTER?"
de = "Hineingehen?"

[[text]]
id = "M032_042"
befehl = ["PRINTCLEAR"]
en = "A STENCILLED NUMBER INDICATES YOU ARE ON DECK "
de = "Laut aufgemalter Nummer seid ihr auf Deck "

[[text]]
