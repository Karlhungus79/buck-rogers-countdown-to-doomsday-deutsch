[[text]]
id = "M032_051"
befehl = ["PRINTCLEAR"]
en = "HORRID GENNIES SLIP INTO THE AIRSHAFT FROM "
de = "Grässliche Gennies dringen in den Luftschacht ein, von "

[[text]]
id = "M032_052"
befehl = ["PRINT"]
en = ". "
de = ""

[[text]]
id = "M032_053"
befehl = ["PRINT"]
en = " WILL HAVE TO FACE THE DRIPPING FANGS ALONE."
de = " muss sich den triefenden Reißzähnen allein stellen."

[[text]]
id = "M032_054"
befehl = ["PRINTCLEAR"]
en = "THE ECGS DISAPPEAR INTO A CONDUIT."
de = "Die ECGs verschwinden in einem Kanal."

[[text]]
id = "M032_055"
befehl = ["SAVE"]
en = "ABOVE"
de = "oben"

[[text]]
id = "M032_056"
befehl = ["SAVE"]
en = "BELOW"
de = "unten"

[[text]]
id = "M032_057"
befehl = ["PRINTCLEAR"]
en = "THIS ROOM IS FILLED WITH INNUMERABLE PIECES OF EQUIPMENT AND SUPPLIES."
de = "Der Raum ist voller Geräte und Vorräte."

[[text]]
id = "M032_058"
befehl = ["PRINTCLEAR"]
en = "NOTHING HERE SEEMS OF IMMEDIATE USE."
de = "Nichts hier scheint gleich nützlich."

[[text]]
id = "M032_059"
befehl = ["PRINTCLEAR"]
en = "YOU LOCATE AN ARGON TANK. SCOT SAYS, 'HEAD UP TO DECK 2.'"
de = "Ihr findet eine Argonflasche. Scot sagt: 'Geht hoch zu Deck 2.'"

[[text]]
id = "M032_060"
befehl = ["PRINTCLEAR"]
en = "THIS IS THE ENGINEERING DECK. THE ENGINES ARE SILENT."
de = "Das ist das Maschinendeck. Die Triebwerke schweigen."

[[text]]
id = "M032_061"
befehl = ["PRINTCLEAR"]
en = "THE SHIP'S OASIS -- THE HYDROPONICS GARDEN -- SEEMS PEACEFUL."
de = "Die Oase des Schiffs, der Hydrokulturgarten, wirkt friedlich."

[[text]]
id = "M032_062"
befehl = ["PRINTCLEAR"]
en = "THE SOUNDS AND SMELLS OF THIS ROOM BEGIN TO RELAX YOU. "
de = "Die Klänge und Düfte dieses Raums beruhigen euch. "

[[text]]
id = "M032_063"
befehl = ["PRINT"]
en = " REMEMBERS A QUIET EVENING WITH AN OLD "
de = " erinnert sich an einen stillen Abend mit "

[[text]]
id = "M032_064"
befehl = ["PRINT"]
en = "FRIEND."
de = "."

[[text]]
id = "M032_065"
befehl = ["PRINT"]
en = " REMEMBERS THE QUIET NIGHTS AND FEELS AGAIN THE PLEASANT EMBRACE."
de = " erinnert sich an die stillen Nächte und spürt wieder die zärtliche Umarmung."

[[text]]
id = "M032_066"
befehl = ["PRINT"]
en = " AWAKES FROM PEACEFUL CONTEMPLATION IN TIME TO SEE "
de = " erwacht aus friedlicher Versenkung und sieht gerade noch "

[[text]]
id = "M032_067"
befehl = ["HMENU"]
menue = true
en = "ATTACK"
de = "Angreifen"

[[text]]
id = "M032_068"
befehl = ["HMENU"]
menue = true
en = "FLEE"
de = "Fliehen"

[[text]]
id = "M032_069"
befehl = ["HMENU"]
menue = true
en = "WATCH"
de = "Zusehen"

[[text]]
id = "M032_070"
befehl = ["PRINT"]
en = " AWAKES FROM THE DREAM TO FIND "
de = " erwacht aus dem Traum und findet "

[[text]]
id = "M032_071"
befehl = ["PRINT"]
en = "SELF"
de = " selbst"

[[text]]
id = "M032_072"
befehl = ["HMENU"]
menue = true
en = "FREE SELF"
de = "Befreien"

[[text]]
id = "M032_073"
befehl = ["HMENU"]
menue = true
en = "WATCH"
de = "Zusehen"

[[text]]
id = "M032_074"
befehl = ["PRINT"]
en = " NEVER STRUGGLES. THE BODY IS HELD GENTLY IN THE PULSING VINES. THE BEAUTIFUL SOUNDS RETURN."
de = " wehrt sich nicht. Der Körper ruht sanft in den pulsierenden Ranken. Die schönen Klänge kehren zurück."

[[text]]
id = "M032_075"
befehl = ["PRINTCLEAR"]
en = ""
de = ""

[[text]]
id = "M032_076"
befehl = ["PRINTCLEAR"]
en = "THERE IS NO PAIN AND THE HORROR QUICKLY FADES. "
de = "Es gibt keinen Schmerz, und das Grauen verblasst schnell. "

[[text]]
id = "M032_077"
befehl = ["PRINT"]
en = "SOON THE DREAM RETURNS. YOU SLEEP FOREVER."
de = "Bald kehrt der Traum zurück. Ihr schlaft für immer."

[[text]]
id = "M032_078"
befehl = ["PRINTCLEAR"]
en = ""
de = ""

[[text]]
id = "M032_079"
befehl = ["PRINTCLEAR"]
en = "IN A FRENZY YOU TEAR INTO THE PLANT. THE WOUNDS BEGIN TO BURN."
de = "In Raserei reißt ihr an der Pflanze. Die Wunden beginnen zu brennen."

[[text]]
id = "M032_080"
befehl = ["PRINTCLEAR"]
en = "NEARBY A PLAQUE READS, 'STAGE 4 ECG. USES SONIC AND SCENT CUES TO LURE VICTIMS. SIMILAR TO EARTH'S PITCHER PLANT.'"
de = "Ein Schild in der Nähe: 'ECG Stufe 4. Lockt Opfer mit Klängen und Düften. Ähnlich der Kannenpflanze der Erde.'"

[[text]]
id = "M032_081"
befehl = ["PRINTCLEAR"]
en = "YOU ABANDON YOUR FRIENDS AND BEGIN TO MOVE AWAY. UNLUCKILY, THE PLEASANT SOUNDS HAVE INCREASED IN POWER."
de = "Ihr lasst eure Freunde zurück und entfernt euch. Leider werden die angenehmen Klänge immer stärker."

[[text]]
id = "M032_082"
befehl = ["PRINTCLEAR"]
en = ""
de = ""

[[text]]
id = "M032_083"
befehl = ["PRINT"]
en = " IMPRISONED IN THE VINES OF AN UNKNOWN PLANT."
de = " gefangen in den Ranken einer unbekannten Pflanze."

[[text]]
id = "M032_084"
befehl = ["PRINTCLEAR"]
en = "SMALL THORNS PENETRATE THE ARMOR. THE VINES PULSE IN TIME TO "
de = "Kleine Dornen durchdringen die Panzerung. Die Ranken pulsieren im Herzschlag von "

[[text]]
id = "M032_085"
befehl = ["PRINT"]
en = "'S HEARTBEAT. "
de = ". "

[[text]]
id = "M032_086"
befehl = ["SAVE"]
en = "BOY"
de = "einem alten Freund"

[[text]]
id = "M032_087"
befehl = ["SAVE"]
en = "GIRL"
de = "einer alten Freundin"

[[text]]
id = "M032_088"
befehl = ["SAVE"]
en = "HER"
de = "sich"

[[text]]
id = "M032_089"
befehl = ["SAVE"]
en = "HIM"
de = "sich"

[[text]]
id = "M032_090"
befehl = ["PRINTCLEAR"]
en = "AN ECG STRIKES IMMEDIATELY."
de = "Sofort schlägt ein ECG zu."

[[text]]
id = "M032_091"
befehl = ["PRINTCLEAR"]
en = "ANOTHER ECG APPROACHES WITH DRIPPING FANGS."
de = "Ein weiterer ECG nähert sich mit triefenden Reißzähnen."

[[text]]
id = "M032_092"
befehl = ["PRINTCLEAR"]
en = "THIS ROOM CONTAINS THE AIR SAMPLING EQUIPMENT FOR THE SHIP. "
de = "Hier steht die Luftanalyse-Anlage des Schiffs. "

[[text]]
id = "M032_093"
befehl = ["PRINT"]
en = "YOU CAN HOOK UP THE ARGON HERE."
de = "Hier könnt ihr das Argon anschließen."

[[text]]
id = "M032_094"
befehl = ["PRINTCLEAR"]
en = "THE ARGON CANISTER CONNECTS. IT HISSES INTO THE AIR SYSTEM."
de = "Die Argonflasche ist angeschlossen. Zischend strömt sie ins Luftsystem."

[[text]]
id = "M032_095"
befehl = ["PRINTCLEAR"]
en = "'ITS WORKING! THEY ARE STARTING TO COLLAPSE..."
de = "'Es wirkt! Sie brechen zusammen..."

[[text]]
id = "M032_096"
befehl = ["PRINT"]
en = "THE STAGE 3S ARE ALSO AFFECTED!"
de = "Auch die Stufe-3-ECGs sind betroffen!"

[[text]]
id = "M032_097"
befehl = ["PRINTCLEAR"]
en = "'HOLD IT! ONE IS REVERSING THE FLOW! THEY ARE REVIVING! QUICKLY, GO TO ENGINEERING AND FIND THE OVERRIDE!'"
de = "'Halt! Einer kehrt den Strom um! Sie erholen sich! Schnell, zum Maschinendeck, sucht die Übersteuerung!'"

[[text]]
id = "M032_098"
befehl = ["PRINTCLEAR"]
en = "THE ENGINES HAVE BEEN SHUT DOWN. TO RESTART REQUIRES ACCESS TO THE CONTROL ROOM."
de = "Die Triebwerke sind abgeschaltet. Zum Neustart braucht ihr Zugang zum Kontrollraum."

[[text]]
id = "M032_099"
befehl = ["PRINTCLEAR"]
en = "THE OVERRIDE CAN BE CANCELED HERE."
de = "Hier lässt sich die Übersteuerung aufheben."

[[text]]
id = "M032_100"
befehl = ["PRINT"]
en = " PULLS OFF THE CONSOLE COVER AND STARTS CROSS-CIRCUITING THE CONTROLS."
de = " nimmt die Konsolenabdeckung ab und überbrückt die Steuerung."

[[text]]
id = "M032_101"
befehl = ["PRINTCLEAR"]
en = "AS YOU EXAMINE THE UNFAMILIAR CIRCUITRY, SCOT SPEAKS, 'LET ME EXPLAIN THE PROCEDURE.' "
de = "Als ihr die fremden Schaltkreise untersucht, sagt Scot: 'Ich erkläre euch das Vorgehen.' "

[[text]]
id = "M032_102"
befehl = ["PRINT"]
en = " BEGINS TO FOLLOW HIS INSTRUCTIONS."
de = " folgt seinen Anweisungen."

[[text]]
id = "M032_103"
befehl = ["PRINTCLEAR"]
en = "WITH THE ARGON HALTED, THE CREATURES ARE FREE. LARGE NUMBERS ARE RUSHING TOWARDS YOU."
de = "Ohne Argon sind die Wesen frei. Massenweise stürmen sie auf euch zu."

[[text]]
id = "M032_104"
befehl = ["PRINTCLEAR"]
en = "YOU CAN MAKE A STAND HERE OR ABANDON THE DECK TO THE ECGS. "
de = "Ihr könnt euch hier stellen oder das Deck den ECGs überlassen. "

[[text]]
id = "M032_105"
befehl = ["WHMENU"]
menue = true
en = "STAND"
de = "Stellen"

[[text]]
id = "M032_106"
befehl = ["WHMENU"]
menue = true
en = "RETREAT"
de = "Rückzug"

[[text]]
id = "M032_107"
befehl = ["PRINTCLEAR"]
en = "THE GENNIES SKITTER FORWARD. "
de = "Die Gennies huschen heran. "

[[text]]
id = "M032_108"
befehl = ["PRINT"]
en = " IS STILL TRYING TO OVERRIDE THE CONTROLS."
de = " versucht noch, die Steuerung zu überbrücken."

[[text]]
id = "M032_109"
befehl = ["PRINTCLEAR"]
en = "THE HORDE OF ECGS LEAP FORWARD, EYES GLITTERING IN ANTICIPATION."
de = "Die Horde ECGs springt vor, mit gierig funkelnden Augen."

[[text]]
id = "M032_110"
befehl = ["PRINT"]
en = " TWISTS THE LAST CONNECTION."
de = " verdrillt die letzte Verbindung."

[[text]]
id = "M032_111"
befehl = ["PRINTCLEAR"]
en = "THE ECGS SLAM INTO YOU, BUT THEY ARE ALREADY COLLAPSING. THEY WRITHE IN THE AIR AND THEN ARE STILL."
de = "Die ECGs prallen gegen euch, brechen aber schon zusammen. Sie winden sich in der Luft, dann rührt sich nichts mehr."

[[text]]
id = "M032_112"
befehl = ["PRINTCLEAR"]
en = "'CONGRATULATIONS! MY MONITORS SHOW LETHAL ARGON CONCENTRATIONS THROUGHOUT THE SHIP. HEAD UP TO THE CONTROL ROOM AND CONTACT NEO.'"
de = "'Glückwunsch! Laut meinen Sensoren ist die Argonkonzentration überall im Schiff tödlich. Geht zum Kontrollraum und ruft die NEO.'"

[[text]]
id = "M032_113"
befehl = ["PRINTCLEAR"]
en = "YOU TRY TO MAKE A BREAK FOR IT, BUT THE GENNIES ARE QUICKER. THEY ATTACK RELENTLESSLY."
de = "Ihr wollt fliehen, aber die Gennies sind schneller. Sie greifen gnadenlos an."

[[text]]
id = "M032_114"
befehl = ["PRINTCLEAR"]
en = "THE DECK IS CLEAR OF ECGS AT LAST. YOU RETURN AND FINISH MODIFYING THE CONTROLS. ARGON HISSES THROUGHOUT THE SHIP."
de = "Endlich ist das Deck frei von ECGs. Ihr kehrt zurück und beendet den Umbau. Argon zischt durch das ganze Schiff."

[[text]]
id = "M032_115"
befehl = ["PRINTCLEAR"]
en = "A MECHANICAL VOICE BOOMS, 'DESTRUCT SYSTEM ARMED AND COUNTING. 20...'"
de = "Eine Maschinenstimme dröhnt: 'Selbstzerstörung aktiviert. Zählung läuft. 20...'"

[[text]]
id = "M032_116"
befehl = ["PRINTCLEAR"]
en = "SCOT SAYS, 'ONE OF THE ECGS MUST HAVE STRUCK THE CONTROL PANELS. GET TO DECK 6 IMMEDIATELY!'"
de = "Scot sagt: 'Ein ECG muss die Steuerpulte getroffen haben. Sofort zu Deck 6!'"

[[text]]
id = "M032_117"
befehl = ["PRINTCLEAR"]
en = "SHATTERED TABLES FLOAT HERE SMEARED WITH STRANGE ICHOR. THE RAM FORCES MADE A STAND HERE."
de = "Zerschmetterte Tische, verschmiert mit seltsamem Sekret, schweben hier. Die RAM-Truppen haben sich hier verschanzt."

[[text]]
id = "M032_118"
befehl = ["PRINTCLEAR"]
en = "THE ROOM IS SPARTAN. IN THE BACK IS A FOLDER."
de = "Der Raum ist karg. Hinten liegt eine Mappe."

[[text]]
id = "M032_119"
befehl = ["PRINTCLEAR"]
en = "THE FOLDER READS, 'I HAVE DESIGNED THE ECGS TO DROP BRAIN PARASITES AS THEY TRAVEL, CREATING A MINEFIELD.'"
de = "In der Mappe steht: 'Die ECGs verlieren unterwegs Hirnparasiten und legen so ein Minenfeld.'"

[[text]]
id = "M032_120"
befehl = ["PRINTCLEAR"]
en = "THE ROOM LOOKS QUICKLY RANSACKED, CLOTHING AND PERSONAL EFFECTS FLOAT EVERYWHERE. YOU SPOT A DIARY TOWARDS THE BACK."
de = "Der Raum wurde hastig durchwühlt, Kleidung und persönliche Dinge schweben überall. Hinten seht ihr ein Tagebuch."

[[text]]
id = "M032_121"
befehl = ["PRINTCLEAR"]
en = "THE DIARY READS, 'SCOT IS ACTING STRANGELY. HE RHAPSODIZES ABOUT THE EARTH. THE ECGS WILL STERILIZE THE PLANET THOUGH.'"
de = "Im Tagebuch steht: 'Scot benimmt sich seltsam. Er schwärmt von der Erde. Doch die ECGs werden den Planeten sterilisieren.'"

[[text]]
id = "M032_122"
befehl = ["PRINTCLEAR"]
en = "THE ROOM IS FILLED WITH BODIES. ONLY ONE IS HUMAN. HE LEANS AGAINST THE FAR WALL CLASPING A LOG IN HIS HANDS."
de = "Der Raum ist voller Leichen. Nur eine ist menschlich. Der Mann lehnt an der hinteren Wand, ein Logbuch in den Händen."

[[text]]
id = "M032_123"
befehl = ["PRINTCLEAR"]
en = "THE LOG CONTAINS THE NAME VILNIKOV, A SIGMA NUMBER AND A PLAN TO CONTROL THE ECGS WITH HARMLESS GAS."
de = "Das Logbuch enthält den Namen Vilnikov, eine Sigma-Nummer und einen Plan, die ECGs mit harmlosem Gas zu kontrollieren."

