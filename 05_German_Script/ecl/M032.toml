[[text]]
id = "M032_000"
befehl = ["PRINTCLEAR"]
en = "SIGNS OF FIERCE COMBAT ARE APPARENT. DARK SPHERES FLOAT PAST AND SMEAR AGAINST THE STAINED WALLS."
de = ""

[[text]]
id = "M032_001"
befehl = ["PRINTCLEAR"]
en = "A BODY RISES, TRANSLUCENT IN THE RED LIGHT. GLOWING GLOBULES SPIRAL AWAY FROM THE FIGURE'S FLAILING ARM."
de = ""

[[text]]
id = "M032_002"
befehl = ["PRINTCLEAR"]
en = "IT SCREAMS AND PASSES THROUGH THE LEFT WALL. SILENCE DESCENDS AGAIN..."
de = ""

[[text]]
id = "M032_003"
befehl = ["PRINTCLEAR"]
en = "ONLY TO BE PUNCTUATED BY THE RUMBLE OF SHIP'S WEAPONS FIRING!"
de = ""

[[text]]
id = "M032_004"
befehl = ["PRINTCLEAR"]
en = "THE AIRLOCK IS SEALED."
de = ""

[[text]]
