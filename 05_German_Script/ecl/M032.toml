# Buck Rogers: Countdown to Doomsday - deutscher Dialogtext, ECL-Modul 32
# de = deutscher Text (leer = englisches Original bleibt). en = nur Referenz, nicht aendern.
# Zeichen: normale Gross-/Kleinschreibung, ä ö ü Ä Ö Ü, ß; \n = Zeilenumbruch (nur wo das Original einen hat).

[[text]]
id = "M032_000"
befehl = ["PRINTCLEAR"]
en = "SIGNS OF FIERCE COMBAT ARE APPARENT. DARK SPHERES FLOAT PAST AND SMEAR AGAINST THE STAINED WALLS."
de = "Überall Spuren heftiger Kämpfe. Dunkle Kugeln schweben vorbei und zerplatzen an den fleckigen Wänden."

[[text]]
id = "M032_001"
befehl = ["PRINTCLEAR"]
en = "A BODY RISES, TRANSLUCENT IN THE RED LIGHT. GLOWING GLOBULES SPIRAL AWAY FROM THE FIGURE'S FLAILING ARM."
de = "Ein Körper steigt auf, durchscheinend im roten Licht. Leuchtende Tropfen wirbeln vom zuckenden Arm der Gestalt davon."

[[text]]
id = "M032_002"
befehl = ["PRINTCLEAR"]
en = "IT SCREAMS AND PASSES THROUGH THE LEFT WALL. SILENCE DESCENDS AGAIN..."
de = "Er schreit und gleitet durch die linke Wand. Wieder kehrt Stille ein..."

[[text]]
id = "M032_003"
befehl = ["PRINTCLEAR"]
en = "ONLY TO BE PUNCTUATED BY THE RUMBLE OF SHIP'S WEAPONS FIRING!"
de = "... bis das Donnern der Schiffsgeschütze sie zerreißt!"

[[text]]
id = "M032_004"
befehl = ["PRINTCLEAR"]
en = "THE AIRLOCK IS SEALED."
de = "Die Luftschleuse ist verriegelt."

[[text]]
id = "M032_005"
befehl = ["PRINTCLEAR"]
en = "THE AIRLOCK IS SEALED. THE EXTERIOR DAMAGE WARNING IS FLASHING."
de = "Die Luftschleuse ist verriegelt. Die Warnung für Außenschäden blinkt."

[[text]]
id = "M032_006"
befehl = ["PRINT"]
en = " YOUR SHIP IS NOWHERE TO BE SEEN."
de = " Von eurem Schiff ist nichts zu sehen."

[[text]]
id = "M032_007"
befehl = ["PRINT"]
en = "SOME OF THE STAGE 3S HAVE EMERGED. THEY ARE WEAK.'"
de = "Einige der Stufe-3-ECGs sind geschlüpft. Sie sind noch schwach.'"

[[text]]
id = "M032_008"
befehl = ["PRINT"]
en = "A STAGE 3 IS MOVING ABOUT, EXAMINING THE CONTROLS.'"
de = "Ein Stufe-3-ECG bewegt sich umher und untersucht die Steuerung.'"

[[text]]
id = "M032_009"
befehl = ["PRINT"]
en = "THE GENNIE HAS ACTIVATED A COMPUTER. IT IS LEARNING QUICKLY.'"
de = "Der Gennie hat einen Computer eingeschaltet. Er lernt schnell.'"

[[text]]
id = "M032_010"
befehl = ["PRINT"]
en = "ITS MANIPULATING THE CONTROLS, LEARNING TO PILOT.'"
de = "Er bedient die Steuerung und lernt zu fliegen.'"

[[text]]
id = "M032_011"
befehl = ["PRINT"]
en = " AWAKES SCREAMING, EYES UNFOCUSED."
de = " erwacht schreiend, mit leerem Blick."

[[text]]
id = "M032_012"
befehl = ["PRINT"]
en = " ATTACKS."
de = " greift an."

[[text]]
id = "M032_013"
befehl = ["PRINT"]
en = " SUDDENLY KEELS OVER."
de = " kippt plötzlich um."

[[text]]
id = "M032_014"
befehl = ["PRINT"]
en = " GETS A SPLITTING HEADACHE."
de = " bekommt rasende Kopfschmerzen."

[[text]]
id = "M032_015"
befehl = ["PRINT"]
en = " NOTICES A SLOWLY SPREADING RASH."
de = " bemerkt einen Ausschlag, der sich langsam ausbreitet."

[[text]]
id = "M032_016"
befehl = ["PRINT"]
en = "'S LEG ITCHES FOR A MOMENT."
de = " spürt kurz ein Jucken im Bein."

[[text]]
id = "M032_017"
befehl = ["PRINTCLEAR"]
en = "SMALL, FANGED CREATURES FLASH TOWARDS YOU."
de = "Kleine Wesen mit Reißzähnen schießen auf euch zu."

[[text]]
id = "M032_018"
befehl = ["PRINTCLEAR"]
en = "DEFENSE ROBOTS ARRIVE. ONE INTONES, 'YOU HAVE BROKEN ISOLATION ORDER. TERMINATION IS REQUIRED.'"
de = "Abwehrroboter treffen ein. Einer verkündet: 'Ihr habt die Isolationsanordnung verletzt. Eliminierung erforderlich.'"

[[text]]
id = "M032_019"
befehl = ["PRINTCLEAR"]
en = "ROBOTS ATTACK, CHANTING, 'TERMINATE, TERMINATE...'"
de = "Roboter greifen an und skandieren: 'Eliminieren, eliminieren...'"

[[text]]
id = "M032_020"
befehl = ["PRINTCLEAR"]
en = "THE TURRET CONTROLS ARE DEACTIVATED. YOUR SHIP IS NOT ON THE SCANNERS."
de = "Die Geschützsteuerung ist abgeschaltet. Euer Schiff ist nicht auf den Scannern."

[[text]]
id = "M032_021"
befehl = ["PRINTCLEAR"]
en = "YOUR EYES RIVET ON A FLOATING BODY WRAPPED IN A STAINED COAT AND MISSING AN ARM."
de = "Euer Blick bleibt an einer schwebenden Leiche hängen: in einen fleckigen Kittel gehüllt, ein Arm fehlt."

[[text]]
id = "M032_022"
befehl = ["PRINTCLEAR"]
en = "NEAR THE CORPSE IS A RECORDER AND A HOLOGRAPHIC PROJECTOR. BITS OF TAPE FLOAT AROUND THE ROOM."
de = "Neben der Leiche sind ein Rekorder und ein Holoprojektor. Bandschnipsel schweben durch den Raum."

[[text]]
id = "M032_023"
befehl = ["PRINTCLEAR"]
en = "'...WE WILL BE ON SCHEDULE FOR DEPLOYMENT AFTER EARTH'S STERILIZATION.'"
de = "'...Wir halten den Zeitplan für den Einsatz nach der Sterilisierung der Erde ein.'"

[[text]]
id = "M032_024"
befehl = ["PRINTCLEAR"]
en = "'OH, NO! POWER FLUCTUATIONS...DISRUPTION OF CONTAINMENT FIELDS...'"
de = "'Oh nein! Energieschwankungen... Ausfall der Eindämmungsfelder...'"

[[text]]
id = "M032_025"
befehl = ["PRINTCLEAR"]
en = "'SCOT! EMERGENCY SHUT DOWN NOW! WHERE ARE YOU?'"
de = "'Scot! Sofort Notabschaltung! Wo bist du?'"

[[text]]
id = "M032_026"
befehl = ["PRINTCLEAR"]
en = "'SCOT IS NONFUNCTIONAL...SECURITY IS NOTIFIED...PREPARING HOLOGRAM...JUST A PRECAUTION...'"
de = "'Scot reagiert nicht... Sicherheit ist alarmiert... bereite Hologramm vor... nur zur Vorsicht...'"

[[text]]
id = "M032_027"
befehl = ["PRINTCLEAR"]
en = "'PROJECTOR COMING ON LINE...WAIT! SO QUICKLY!? THE GLEAMING EYES...NO! GET BACK!"
de = "'Projektor fährt hoch... Moment! So schnell!? Diese glühenden Augen... Nein! Zurück!"

[[text]]
id = "M032_028"
befehl = ["PRINT"]
en = "'AAAAAAAAAAAHHHHHHHHHHH!!!!!'"
de = "'Aaaaaaaaaaaahhhhhhhhhhh!!!!!'"

[[text]]
id = "M032_029"
befehl = ["PRINTCLEAR"]
en = "'THIS IS DR. WILLIAMS AND MY SIGMA CODE IS...' A STRING OF NUMBERS FOLLOWS."
de = "'Hier spricht Dr. Williams, mein Sigma-Code lautet...' Es folgt eine Zahlenreihe."

[[text]]
id = "M032_030"
befehl = ["PRINTCLEAR"]
en = "THIS ONE IS DATED EARLIER. 'THE ECG CANISTERS ARE LOADED FOR EARTH. THEY WILL MOLT ON PLANET.'"
de = "Diese Aufnahme ist älter. 'Die ECG-Behälter für die Erde sind verladen. Sie häuten sich auf dem Planeten.'"

[[text]]
id = "M032_031"
befehl = ["PRINTCLEAR"]
en = "YOU RECOVER A BIT OF TAPE. DO YOU PLAY IT?"
de = "Ihr findet ein Stück Band. Abspielen?"

[[text]]
id = "M032_032"
befehl = ["HMENU"]
menue = true
en = "UP"
de = "Hoch"

[[text]]
id = "M032_033"
befehl = ["HMENU"]
menue = true
en = "DOWN"
de = "Runter"

[[text]]
